<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pho Co. Admin | Sign in</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141111; font-family: system-ui, sans-serif; }
    form { background: #fff; padding: 36px; border-radius: 16px; width: min(360px, 90vw); display: grid; gap: 14px; }
    h1 { margin: 0; font-size: 1.4rem; }
    h1 span { color: #e2231a; }
    input { padding: 12px; font-size: 1rem; border: 1.5px solid #ddd; border-radius: 10px; }
    button { padding: 12px; font-size: 1rem; font-weight: 700; background: #e2231a; color: #fff; border: 0; border-radius: 10px; cursor: pointer; }
    p { margin: 0; color: #e2231a; font-weight: 600; min-height: 1.2em; }
  </style>
</head>
<body>
  <form id="f">
    <h1><span>Pho Co.</span> Leads</h1>
    <input type="password" name="password" placeholder="Password" required autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    <p id="m"></p>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: e.target.password.value }) });
      if (r.ok) return (location.href = '/admin');
      const j = await r.json().catch(() => ({}));
      document.getElementById('m').textContent = j.error || 'Sign-in failed.';
    });
  </script>
</body>
</html>
